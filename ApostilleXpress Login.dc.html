        <sc-if value="{{ isPasswordStep }}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{ back }}" style="display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 0; border: none; background: transparent; font-family: inherit; font-size: 13px; color: #495057; cursor: pointer; font-weight: 600" style-hover="color:#343A40; text-decoration-line: underline; text-decoration-style: solid"><i class="bi bi-arrow-left" aria-hidden="true"></i>{{ email }}</button>
        </sc-if>
        <h1 id="ax-login-title" style="margin: 2px 0 0; font-size: 28px; line-height: 1.2; font-weight: 600; color: #181D27">{{ title }}</h1>
        <sc-if value="{{ formError }}" hint-placeholder-val="{{ false }}">
          <p role="alert" style="margin: 0; font-size: 14px; line-height: 1.45; font-weight: 400; color: #E33B32; text-wrap: pretty">{{ formError }}</p>
        </sc-if>
        <sc-if value="{{ showSubtitle }}" hint-placeholder-val="{{ true }}">
          <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #535862; text-wrap: pretty">{{ subtitle }}</p>
        </sc-if>
      </div>

      <form novalidate="novalidate" onSubmit="{{ submit }}" style="margin-top:28px;display:flex;flex-direction:column;gap:18px">
        <sc-if value="{{ showEmailField }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:6px">
          <label for="ax-email" style="font-size: 14px; font-weight: 500; color: #495057">Email <span style="color:#E33B32" aria-hidden="true">*</span></label>
          <input id="ax-email" name="email" type="email" autoComplete="username" required="{{ true }}" placeholder="you@example.com" value="{{ email }}" onChange="{{ setEmail }}" aria-required="true" aria-invalid="{{ emailInvalid }}" aria-describedby="ax-email-err" style="width: 100%; height: 48px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #495057; background: #fff; border: 1px solid {{ emailBorderColor }}; border-radius: 8px; outline: none; transition: border-color 200ms ease,box-shadow 200ms ease" style-hover="border-color:#6EA8FE" style-focus="border:2px solid #6EA8FE;padding:0 13px;background:#fff;box-shadow:0 1px 2px 0 rgba(10,13,18,0.05)">
        </div>
        </sc-if>

        <sc-if value="{{ isPasswordStep }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:6px">
          <label for="ax-password" style="font-size: 14px; font-weight: 500; color: #495057">Password <span style="color:#E33B32" aria-hidden="true">*</span></label>
          <div style="display:flex;align-items:center;gap:6px;height:48px;padding:0 6px 0 14px;background:#fff;border:1px solid {{ pwBorderColor }};border-radius:8px;transition:border-color 200ms ease,box-shadow 200ms ease" style-hover="border-color:#6EA8FE" style-focus-within="border:2px solid #6EA8FE;padding:0 5px 0 13px;background:#fff;box-shadow:0 1px 2px 0 rgba(10,13,18,0.05)">
            <input id="ax-password" name="password" type="{{ pwType }}" autoComplete="current-password" required="{{ true }}" placeholder="Enter your password" value="{{ password }}" onChange="{{ setPassword }}" aria-required="true" aria-invalid="{{ pwInvalid }}" aria-describedby="ax-pw-err" style="flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: transparent; font-family: inherit; font-size: 16px; color: #495057">
            <button type="button" onClick="{{ togglePw }}" aria-label="{{ pwToggleLabel }}" aria-pressed="{{ showPw }}" title="{{ pwToggleLabel }}" style="flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:none;border-radius:8px;background:transparent;color:#5c6f71;font-size:18px;cursor:pointer;transition:background 200ms ease,color 200ms ease" style-hover="background-color:F2F2F2" style-focus="outline:none;box-shadow:0 0 0 3px rgba(0,182,189,.45)"><i class="{{ pwIcon }}" aria-hidden="true"></i></button>
          </div>
          <sc-if value="{{ pwInvalid }}" hint-placeholder-val="{{ false }}"><p id="ax-pw-err" role="alert" style="margin:0;font-size:13px;color:#E33B32">Enter your password</p></sc-if>
        </div>

        <div style="display:flex;align-items:center;justify-content:flex-start">
          <a href="#" onClick="{{ goForgot }}" style="font-size: 14px; font-weight: 400; color: #495057; text-decoration: none" style-hover="color:#0D5257;text-decoration:underline">Forgot my password</a>
        </div>
        </sc-if>

        <sc-if value="{{ isCodeStep }}" hint-placeholder-val="{{ false }}">

    const titles = { email: 'Log in to your account', password: 'Enter Password', mfa: 'Multi-Factor Authentication', forgot: 'Forgot password?', code: 'Reset password', change: 'Change password' };
    const subtitles = {

      forgot: 'Enter your email & we’ll send you reset instructions.',
      code: 'Enter the code sent to ' + (raw || 'your email'),
      change: 'Set a new password for your account.',
    };

    const checks = [
      ['One lowercase character', /[a-z]/.test(p)],
      ['One uppercase character', /[A-Z]/.test(p)],
      ['One number character', /[0-9]/.test(p)],
      ['One special character', /[^A-Za-z0-9]/.test(p)],

      codeBorderColor: s.codeInvalid ? '#E33B32' : '#CED4DA',

      goForgot: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ step: 'forgot', password: '', pwInvalid: false, emailInvalid: false, formError: '' }); },

        }
        if (s.step === 'change') {
          if (s.newPw !== s.confirmPw) return this.setState({ mismatch: true, formError: 'Passwords do not match. Please ensure that both entries are identical and try again.' });
          if (this.props.changeFails) return this.setState({ formError: 'We are having trouble changing your password. Please try again.' });
          this.setState({ loading: true });
          clearTimeout(this._t);
          this._t = setTimeout(() => this.setState({ step: 'email', loading: false, password: '', code: '', newPw: '', confirmPw: '', formError: '' }), 1200);
          return;
        }
        if (s.password.length === 0) return this.setState({ pwInvalid: true, formError: '' });
                this.setState({ loading: true });
        clearTimeout(this._t);
        this._t = setTimeout(() => { window.location.href = 'CA Dashboard.dc.html'; }, 1000);
      },
    };
  }
}
</script>
